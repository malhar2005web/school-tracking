<!DOCTYPE html>
<html class="h-full bg-surface" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SchoolTrack Parent App</title>
    <base href="/" />
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Leaflet Map CSS (Bundled local failsafe) -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    
    <!-- SchoolTrack Claymorphic Stylesheet -->
    <link rel="stylesheet" href="css/claymorphic.css" />
    <link rel="stylesheet" href="SchoolTrack.ParentApp.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen antialiased">
    <div id="app">
        <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; font-family:'Plus Jakarta Sans',sans-serif; background:#fbf8ff; color:#181930;">
            <div style="width:60px; height:60px; border-radius:50%; background:#9b83f6; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(155,131,246,0.4); animation:bounce 1.5s infinite;">
                <span class="material-symbols-outlined" style="font-size:32px; color:#ffffff;">directions_bus</span>
            </div>
            <div style="font-weight:800; font-size:1.25rem; letter-spacing:-0.02em;">SchoolTrack</div>
            <div style="font-size:0.875rem; color:#484552;">Connecting to live safety radar...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet style="display:none; position:fixed; bottom:0; left:0; right:0; background:#ba1a1a; color:#ffffff; padding:0.75rem 1rem; z-index:20000; font-size:0.875rem;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span>An unhandled error has occurred.</span>
            <a href="." style="color:#ffd66b; font-weight:700; text-decoration:underline;">Reload</a>
        </div>
    </div>

    <!-- Leaflet JS & Map Interop (Bundled local failsafe) -->
    <script src="lib/leaflet/leaflet.js"></script>
    <script src="js/parentMap.js"></script>

    <!-- Blazor WebView -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
