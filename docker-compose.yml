services:
  postgres:
    image: postgres:17-alpine
    container_name: schooltrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schooltrack}
      POSTGRES_USER: ${POSTGRES_USER:-schooltrack_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - schooltrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schooltrack_app} -d ${POSTGRES_DB:-schooltrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schooltrack-net

  redis:
    image: redis:7-alpine
    container_name: schooltrack-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password_123}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - schooltrack_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - schooltrack-net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: schooltrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-schooltrack};Username=${POSTGRES_USER:-schooltrack_app};Password=${POSTGRES_PASSWORD:-change_me_local_dev_password}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis_secure_password_123}"
      Jwt__Issuer: ${JWT_ISSUER:-SchoolTrack.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-SchoolTrack.Clients}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-SchoolTrack_DefaultSecretKey_MustBeOverriddenInProductionEnvironments12345!}
    ports:
      - "${API_HTTP_PORT:-5080}:8080"
    networks:
      - schooltrack-net

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: schooltrack-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://api:8080
    ports:
      - "${ADMIN_HTTP_PORT:-5081}:8080"
    networks:
      - schooltrack-net

networks:
  schooltrack-net:
    driver: bridge

volumes:
  schooltrack_pgdata:
  schooltrack_redisdata:
